name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      BUILD_DIR: build
      INSTALL_DIR: openMVG-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S src -B $env:BUILD_DIR
          -G "Visual Studio 17 2022"
          -A x64
          -DOpenMVG_BUILD_DOC=OFF
          -DOpenMVG_BUILD_TESTS=OFF
          -DOpenMVG_BUILD_EXAMPLES=ON
          -DOpenMVG_BUILD_SOFTWARES=ON
          -DOpenMVG_BUILD_GUI_SOFTWARES=OFF
          -DOpenMVG_USE_RERUN=OFF
          -DSCHUR_SPECIALIZATIONS=OFF
          -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/$env:INSTALL_DIR"

      - name: Build
        run: cmake --build $env:BUILD_DIR --config $env:BUILD_TYPE --parallel

      - name: Install
        run: cmake --install $env:BUILD_DIR --config $env:BUILD_TYPE

      - name: Package
        run: Compress-Archive -Path "$env:INSTALL_DIR/*" -DestinationPath "$env:INSTALL_DIR.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openMVG-windows-x64
          path: openMVG-windows-x64.zip
          if-no-files-found: error
